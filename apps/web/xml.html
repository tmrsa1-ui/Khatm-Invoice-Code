<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص XML — ختم فاتورة</title>
<link rel="stylesheet" href="./styles.css">
<body>
<h1>فحص XML</h1>
<p class="disclaimer">يُرفض DOCTYPE والكيانات. ليس XSD. ليس اعتمادًا من زاتكا.</p>
<textarea id="xml" placeholder="الصق XML"></textarea>
<p><button id="run" type="button">افحص</button></p>
<p id="status"></p>
<ul id="findings"></ul>
<p><a href="./index.html">الرئيسية</a></p>
<script src="./engine.js"></script>
<script>
const E = window.KhatmEngine;
document.getElementById("run").onclick = () => {
  const s = E.validateSession({ xmlText: document.getElementById("xml").value });
  document.getElementById("status").textContent = s.overall_status + " — " + s.disclaimer_ar;
  const ul = document.getElementById("findings"); ul.innerHTML = "";
  s.findings.forEach(f => {
    const li = document.createElement("li"); li.className = "finding";
    li.textContent = f.status + " — " + f.title_ar;
    ul.appendChild(li);
  });
};
</script>
</body></html>
