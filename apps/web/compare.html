<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مقارنة — ختم فاتورة</title>
<link rel="stylesheet" href="./styles.css">
<body>
<header>
  <strong>ختم فاتورة</strong>
  <nav><a href="./index.html">الرئيسية</a><a href="./qr.html">QR</a><a href="./xml.html">XML</a></nav>
</header>
<main>
  <h1>قارن QR وXML</h1>
  <p class="disclaimer">التعارض يمنع اعتبار النتيجة نجاحًا محليًا. ليست اعتمادًا من زاتكا.</p>
  <p class="limits">C14N11 / تجزئة الفاتورة: <span class="pill INCONCLUSIVE">INCONCLUSIVE</span> — XSD/Schematron: <span class="pill NOT_CHECKED">NOT_CHECKED</span></p>
  <label for="qr">QR</label>
  <textarea id="qr" rows="4" autocomplete="off" spellcheck="false"></textarea>
  <label for="xml">XML</label>
  <textarea id="xml" rows="8" autocomplete="off" spellcheck="false"></textarea>
  <div class="row">
    <button id="run-compare" type="button">قارن</button>
    <button id="sample-qr" class="secondary" type="button">عيّنة QR</button>
    <button id="export-json" class="secondary" type="button">JSON</button>
  </div>
  <p>الحالة: <span id="status" class="pill NOT_CHECKED">NOT_CHECKED</span></p>
  <div id="layers" class="layers"></div>
  <div id="compare-table"></div>
  <ul id="findings" class="findings"></ul>
</main>
